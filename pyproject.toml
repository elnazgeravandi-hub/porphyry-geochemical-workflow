[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "porphyry-geochemical-clustering"
version = "0.4.0"
description = "Flowchart-organized geochemical clustering and exploration evaluation"
requires-python = ">=3.11"
dependencies = ["numpy==2.3.5", "scipy==1.17.0", "pandas==2.2.3", "scikit-learn==1.8.0", "threadpoolctl==3.6.0"]

[project.optional-dependencies]
spatial = ["geopandas==1.2.0", "shapely==2.2.0"]
dbcv = ["hdbscan==0.8.44"]
test = ["pytest==9.2.0"]
report = ["matplotlib==3.10.8"]

[project.scripts]
porphyry-workflow = "workflow.run:main"
porphyry-prepare = "data_preparation.run:main"
porphyry-compare = "model_comparison.run:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["common*", "data_preparation*", "baseline_models*", "optimized_models*", "model_comparison*", "validation_interpretation*", "exploration_evaluation*", "workflow*"]
